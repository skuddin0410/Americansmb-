<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site footer</title>
<script src="./data.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.esme-ft{background:#0F1F4D;color:#D0D5DD;font-family:'Montserrat',Arial,sans-serif}
.esme-ft a{color:#D0D5DD;text-decoration:none}
.esme-ft a:hover{color:#FFFFFF;text-decoration:none}
.esme-ft-h{margin:0 0 4px;font-family:'Montserrat',Arial,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#FFFFFF}
.esme-ft-h::after{content:"";display:block;width:24px;height:2px;margin-top:10px;background:#F7931E;border-radius:2px}
.esme-ft-sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.esme-ft-sub input{flex:1 1 200px;min-width:0;height:44px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#FFFFFF;font-size:14.5px;font-family:inherit}
.esme-ft-sub input::placeholder{color:rgba(200,205,214,.7)}
.esme-ft-sub input:focus{outline:none;border-color:#F7931E}
.esme-ft-bar{margin-top:48px;padding-top:20px;border-top:1px solid rgba(200,205,214,.18);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;font-size:13px}
.esme-ft-note{color:#98A2B3}
.esme-ft-col{flex:1 1 140px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.esme-ft-col a{display:flex;align-items:center;min-height:32px}
.esme-ft-mail{display:inline-flex !important;align-items:center;gap:8px;margin-top:4px;color:#F7931E !important;font-family:'Montserrat',Arial,sans-serif;font-weight:700}
.esme-ft-mail:hover{color:#FFFFFF !important}
.esme-ft-mail svg{flex:none}
.esme-ft-bar a{display:inline-flex;align-items:center;min-height:32px}
@media (max-width: 700px){.esme-ft-col{flex:1 1 40%}}
</style>
</helmet>
<footer class="esme-ft">
<div style="max-width: 1232px; margin: 0 auto; padding-left: 32px; padding-right: 32px; box-sizing: border-box; padding-top: 64px; padding-bottom: 28px">
<div style="display: flex; flex-wrap: wrap; gap: 40px 32px; justify-content: space-between">
<div style="flex: 2 1 260px; display: flex; flex-direction: column; gap: 16px">
<img src="logo-dark.png" alt="AmericanSMB — For American Small Businesses" width="760" height="145" style="display: block; height: 52px; width: auto; align-self: flex-start">
<p style="margin: 0; font-size: 14.5px; line-height: 1.65; max-width: 340px">Practical news, stories and tools that help American small business owners grow.</p>
</div>
<sc-for list="{{cols}}" as="fc" hint-placeholder-count="4">
<nav aria-label="{{fc.title}}" class="esme-ft-col">
<h3 class="esme-ft-h" style="margin-bottom: 10px">{{fc.title}}</h3>
<sc-for list="{{fc.links}}" as="fl" hint-placeholder-count="5">
<a href="{{fl.href}}">{{fl.label}}</a>
</sc-for>
</nav>
</sc-for>
<div class="esme-ft-col" aria-label="Contact" role="group">
<h3 class="esme-ft-h" style="margin-bottom: 10px">Contact</h3>
<a class="esme-ft-mail" href="mailto:info@americansmb.com"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>info@americansmb.com</a>
<a href="Contact.dc.html">Contact form</a>
<a href="Advertise.dc.html#advertise-form">Advertising enquiries</a>
<a href="SubmitStory.dc.html">Story ideas</a>
</div>
</div>
<div class="esme-ft-bar">
<span>© {{year}} AmericanSMB. All rights reserved.<sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}"><span class="esme-ft-note"> · {{note}}</span></sc-if></span>
<span style="display: flex; flex-wrap: wrap; gap: 18px"><a href="Page.dc.html?p=privacy-policy">Privacy</a><a href="Page.dc.html?p=terms-of-use">Terms of use</a><a href="Page.dc.html?p=cookie-policy">Cookies</a><a href="Sitemap.dc.html">Sitemap</a></span>
</div>
</div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"note":{"editor":"text","default":""},"$preview":{"width":1440,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const S = typeof ESME !== 'undefined' ? ESME.sections : {};
    const note = this.props.note || '';
    return {
      year: String(new Date().getFullYear()),
      note, hasNote: !!note,
      cols: [
        { title: 'Explore', links: [{ label: 'Latest news & guides', href: 'Articles.dc.html' }, { label: 'Funding & grants', href: 'FundingHub.dc.html' }, { label: 'Tax deadlines', href: 'Compliance.dc.html' }, { label: 'Free tools', href: 'Tools.dc.html' }, { label: 'Main Street Briefing', href: '#' }] },
        { title: 'Topics', links: Object.keys(S).map((k) => ({ label: S[k].label, href: 'Articles.dc.html?section=' + k })) },
        { title: 'Company', links: [{ label: 'About AmericanSMB', href: 'About.dc.html' }, { label: 'Contact us', href: 'Contact.dc.html' }, { label: 'Advertise with us', href: 'Advertise.dc.html' }, { label: 'Submit your story', href: 'SubmitStory.dc.html' }, { label: 'Become a partner', href: '#' }] }
      ]
    };
  }
}
</script>
</body>
</html>
